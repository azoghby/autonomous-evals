name: CI
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://u:p@localhost/db
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      AUTH_SECRET: ci-dummy-secret-ci-dummy-secret-0000
      ENCRYPTION_KEY: Y2ktZHVtbXkta2V5LWNpLWR1bW15LWtleS0wMDAwMDA=
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
      BLOB_READ_WRITE_TOKEN: vercel_blob_rw_dummy
      NAIVE_API_KEY: dummy
      CRON_SECRET: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (web)
        run: npx tsc -p apps/web --noEmit
      - name: Typecheck (core)
        run: npx tsc -p packages/core --noEmit
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
