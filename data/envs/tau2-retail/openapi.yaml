      summary: Return some items of a delivered order.
      description: Return some items of a delivered order. The order status will be changed to 'return requested'. The agent needs to explain the return detail and ask for explicit user confirmation (yes/no) to proceed. The user will receive follow-up email for how and where to return the item. The refund payment method must be the original payment method or a gift card of the user. If a precondition fails the database is left unchanged and the call returns an error.
      x-effect: write
      x-sandbox-sql:
        resultShape: row
        statements:
          - |-
            WITH chk AS (SELECT o.id FROM orders o JOIN user_payment_methods pm ON pm.id = :payment_method_id AND pm.user_id = o.user_id WHERE o.id = :order_id AND o.status = 'delivered' AND (pm.source = 'gift_card' OR pm.id = (SELECT p.payment_method_id FROM order_payments p WHERE p.order_id = o.id ORDER BY p.id LIMIT 1)) AND NOT EXISTS (SELECT 1 FROM (SELECT e.x, count(*) AS c FROM jsonb_array_elements_text(CAST(:item_ids AS jsonb)) AS e(x) GROUP BY e.x) r WHERE r.c > (SELECT count(*) FROM order_items i WHERE i.order_id = :order_id AND i.item_id = r.x))),
            upd AS (UPDATE orders SET status = 'return requested', return_items = COALESCE((SELECT jsonb_agg(e.x ORDER BY e.x COLLATE "C") FROM jsonb_array_elements_text(CAST(:item_ids AS jsonb)) AS e(x)), '[]'::jsonb), return_payment_method_id = :payment_method_id FROM chk WHERE orders.id = chk.id RETURNING orders.*)
            SELECT o.id AS order_id, o.user_id, json_build_object('address1', o.address1, 'address2', o.address2, 'city', o.city, 'country', o.country, 'state', o.state, 'zip', o.zip) AS address, COALESCE((SELECT json_agg(json_build_object('name', i.name, 'product_id', i.product_id, 'item_id', i.item_id, 'price', i.price, 'options', i.options) ORDER BY i.id) FROM (SELECT x.id, x.name, x.product_id, x.item_id, x.price, x.options FROM order_items x WHERE x.order_id = o.id) i), '[]'::json) AS items, o.status, COALESCE((SELECT json_agg(json_build_object('tracking_id', f.tracking_ids, 'item_ids', f.item_ids) ORDER BY f.id) FROM order_fulfillments f WHERE f.order_id = o.id), '[]'::json) AS fulfillments, COALESCE((SELECT json_agg(json_build_object('transaction_type', p.transaction_type, 'amount', p.amount, 'payment_method_id', p.payment_method_id) ORDER BY p.id) FROM (SELECT x.id, x.transaction_type, x.amount, x.payment_method_id FROM order_payments x WHERE x.order_id = o.id) p), '[]'::json) AS payment_history, o.cancel_reason, o.exchange_items, o.exchange_new_items, o.exchange_payment_method_id, o.exchange_price_difference, o.return_items, o.return_payment_method_id FROM upd o
      parameters:
        - name: order_id
          in: path
          required: true
          description: The order id, such as '#W0000000'. Be careful there is a '#' symbol at the beginning of the order id.
          schema:
            type: string
          example: '#W1267569'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - item_ids
                - payment_method_id
              properties:
                item_ids:
                  type: array
                  items:
                    type: string
                  description: The item ids to be returned, each such as '1008292230'. There could be duplicate items in the list.
                  example:
                    - '1008292230'
                payment_method_id:
                  type: string
                  description: The payment method id to pay or receive refund for the item price difference, such as 'gift_card_0000000' or 'credit_card_0000000'. These can be looked up from the user or order details.
                  example: credit_card_0000000
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - order_id
                  - user_id
                  - address
                  - items
                  - status
                  - fulfillments
                  - payment_history
                properties:
                  order_id:
                    type: string
                    example: '#W1267569'
                  user_id:
                    type: string
                  address:
                    type: object
                    properties:
                      address1:
                        type: string
                      address2:
                        type: string
                      city:
                        type: string
                      state:
                        type: string
                      country:
                        type: string
                      zip:
                        type: string
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        product_id:
                          type: string
                        item_id:
                          type: string
                        price:
                          type: number
                        options:
                          type: object
                  status:
                    type: string
                    enum:
                      - pending
                      - pending (item modified)
                      - processed
                      - delivered
                      - cancelled
                      - exchange requested
                      - return requested
                  fulfillments:
                    type: array
                    items:
                      type: object
                      properties:
                        tracking_id:
                          type: array
                          items:
                            type: string
                        item_ids:
                          type: array
                          items:
                            type: string
                  payment_history:
                    type: array
                    items:
                      type: object
                      properties:
                        transaction_type:
                          type: string
                          enum:
                            - payment
                            - refund
                        amount:
                          type: number
                        payment_method_id:
                          type: string
                  cancel_reason:
                    type:
                      - string
                      - 'null'
                  exchange_items:
                    type:
                      - array
                      - 'null'
                    items:
                      type: string
                  exchange_new_items:
                    type:
                      - array
                      - 'null'
                    items:
                      type: string
                  exchange_payment_method_id:
                    type:
                      - string
                      - 'null'
                  exchange_price_difference:
                    type:
                      - number
                      - 'null'
                  return_items:
                    type:
                      - array
                      - 'null'
                    items:
                      type: string
                  return_payment_method_id:
                    type:
                      - string
                      - 'null'
  /transfers:
    post:
      operationId: transfer_to_human_agents
      summary: Transfer the user to a human agent, with a summary of the user's issue.
      description: Transfer the user to a human agent, with a summary of the user's issue. Only transfer if the user explicitly asks for a human agent, or given the policy and the available tools, you cannot solve the user's issue. Returns a message indicating the user has been transferred to a human agent; the transfer is recorded in the sandbox outbox.
      x-effect: external
      x-sandbox-sql:
        resultShape: row
        statements:
          - INSERT INTO sandbox_outbox (tool, args, payload) VALUES ('transfer_to_human_agents', jsonb_build_object('summary', CAST(:summary AS text)), jsonb_build_object('summary', CAST(:summary AS text), 'result', 'Transfer successful')) RETURNING 'Transfer successful' AS result
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - summary
              properties:
                summary:
                  type: string
                  description: A summary of the user's issue.
                  example: The user wants a price match, which is not supported.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - result
                properties:
                  result:
                    type: string
                    example: Transfer successful
