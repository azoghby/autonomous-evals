      summary: Modify the payment method of a pending order.
      description: Modify the payment method of a pending order. The agent needs to explain the modification detail and ask for explicit user confirmation (yes/no) to proceed. The new payment method must differ from the current one, and a gift card must have enough balance to cover the order amount. If a precondition fails the database is left unchanged and the call returns an error.
