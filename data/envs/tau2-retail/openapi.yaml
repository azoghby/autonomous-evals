  /orders/{order_id}/items:
    post:
      operationId: modify_pending_order_items
      summary: Modify items in a pending order to new items of the same product type.
      description: Modify items in a pending order to new items of the same product type. For a pending order, this function can only be called once. The agent needs to explain the exchange detail and ask for explicit user confirmation (yes/no) to proceed. The order status becomes 'pending (item modified)'. The price difference is charged to (or refunded to) the given payment method; a gift card must have enough balance. If a precondition fails the database is left unchanged and the call returns an error.
      x-effect: write
      x-sandbox-sql:
        resultShape: row
        statements:
          - |-
            WITH oi AS (SELECT i.*, row_number() OVER (PARTITION BY i.item_id ORDER BY i.id) AS occ FROM order_items i WHERE i.order_id = :order_id),
            req AS (SELECT t.old_id, n.new_id, t.ord, row_number() OVER (PARTITION BY t.old_id ORDER BY t.ord) AS occ FROM jsonb_array_elements_text(CAST(:item_ids AS jsonb)) WITH ORDINALITY AS t(old_id, ord) JOIN jsonb_array_elements_text(CAST(:new_item_ids AS jsonb)) WITH ORDINALITY AS n(new_id, ord) ON n.ord = t.ord),
            matched AS (SELECT oi.id AS line_id, r.new_id, v.price AS new_price, v.options AS new_options, oi.price AS old_price FROM req r JOIN oi ON oi.item_id = r.old_id AND oi.occ = r.occ JOIN product_variants v ON v.item_id = r.new_id AND v.product_id = oi.product_id AND v.available),
            chk AS (SELECT o.id, o.user_id, COALESCE((SELECT sum(m.new_price - m.old_price) FROM matched m), 0) AS diff FROM orders o JOIN user_payment_methods pm ON pm.id = :payment_method_id AND pm.user_id = o.user_id WHERE o.id = :order_id AND o.status = 'pending' AND jsonb_array_length(CAST(:item_ids AS jsonb)) = jsonb_array_length(CAST(:new_item_ids AS jsonb)) AND (SELECT count(*) FROM matched) = jsonb_array_length(CAST(:item_ids AS jsonb)) AND NOT EXISTS (SELECT 1 FROM req WHERE old_id = new_id) AND (pm.source <> 'gift_card' OR pm.balance >= COALESCE((SELECT sum(m.new_price - m.old_price) FROM matched m), 0))),
            pay AS (INSERT INTO order_payments (order_id, transaction_type, amount, payment_method_id) SELECT chk.id, CASE WHEN chk.diff > 0 THEN 'payment' ELSE 'refund' END, abs(chk.diff), CAST(:payment_method_id AS text) FROM chk RETURNING *),
            gc AS (UPDATE user_payment_methods pm SET balance = round(pm.balance - chk.diff, 2) FROM chk WHERE pm.id = :payment_method_id AND pm.user_id = chk.user_id AND pm.source = 'gift_card' RETURNING pm.id),
            ui AS (UPDATE order_items i SET item_id = m.new_id, price = m.new_price, options = m.new_options FROM matched m, chk WHERE i.id = m.line_id AND i.order_id = chk.id RETURNING i.*),
            uo AS (UPDATE orders SET status = 'pending (item modified)' FROM chk WHERE orders.id = chk.id RETURNING orders.*)
            SELECT o.id AS order_id, o.user_id, json_build_object('address1', o.address1, 'address2', o.address2, 'city', o.city, 'country', o.country, 'state', o.state, 'zip', o.zip) AS address, COALESCE((SELECT json_agg(json_build_object('name', i.name, 'product_id', i.product_id, 'item_id', i.item_id, 'price', i.price, 'options', i.options) ORDER BY i.id) FROM (SELECT x.id, x.name, x.product_id, x.item_id, x.price, x.options FROM order_items x WHERE x.order_id = o.id AND x.id NOT IN (SELECT u.id FROM ui u) UNION ALL SELECT u.id, u.name, u.product_id, u.item_id, u.price, u.options FROM ui u) i), '[]'::json) AS items, o.status, COALESCE((SELECT json_agg(json_build_object('tracking_id', f.tracking_ids, 'item_ids', f.item_ids) ORDER BY f.id) FROM order_fulfillments f WHERE f.order_id = o.id), '[]'::json) AS fulfillments, COALESCE((SELECT json_agg(json_build_object('transaction_type', p.transaction_type, 'amount', p.amount, 'payment_method_id', p.payment_method_id) ORDER BY p.id) FROM (SELECT x.id, x.transaction_type, x.amount, x.payment_method_id FROM order_payments x WHERE x.order_id = o.id UNION ALL SELECT n.id, n.transaction_type, n.amount, n.payment_method_id FROM pay n WHERE n.order_id = o.id) p), '[]'::json) AS payment_history, o.cancel_reason, o.exchange_items, o.exchange_new_items, o.exchange_payment_method_id, o.exchange_price_difference, o.return_items, o.return_payment_method_id FROM uo o
      parameters:
        - name: order_id
          in: path
          required: true
          description: The order id, such as '#W0000000'. Be careful there is a '#' symbol at the beginning of the order id.
          schema:
            type: string
          example: '#W1267569'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - item_ids
                - new_item_ids
                - payment_method_id
              properties:
                item_ids:
                  type: array
                  items:
                    type: string
                  description: The item ids to be modified, each such as '1008292230'. There could be duplicate items in the list.
                  example:
                    - '1008292230'
                new_item_ids:
                  type: array
                  items:
                    type: string
                  description: The item ids to be modified for, each such as '1008292230'. There could be duplicate items in the list. Each new item id should match the item id in the same position and be of the same product.
                  example:
                    - '1008292231'
                payment_method_id:
                  type: string
                  description: The payment method id to pay or receive refund for the item price difference, such as 'gift_card_0000000' or 'credit_card_0000000'. These can be looked up from the user or order details.
                  example: credit_card_0000000
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - order_id
                  - user_id
                  - address
                  - items
                  - status
                  - fulfillments
                  - payment_history
                properties:
                  order_id:
                    type: string
                    example: '#W1267569'
                  user_id:
                    type: string
                  address:
                    type: object
                    properties:
                      address1:
                        type: string
                      address2:
                        type: string
                      city:
                        type: string
                      state:
                        type: string
                      country:
                        type: string
                      zip:
                        type: string
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        product_id:
                          type: string
                        item_id:
                          type: string
                        price:
                          type: number
                        options:
                          type: object
                  status:
                    type: string
                    enum:
                      - pending
                      - pending (item modified)
                      - processed
                      - delivered
                      - cancelled
                      - exchange requested
                      - return requested
                  fulfillments:
                    type: array
                    items:
                      type: object
                      properties:
                        tracking_id:
                          type: array
                          items:
                            type: string
                        item_ids:
                          type: array
                          items:
                            type: string
                  payment_history:
                    type: array
                    items:
                      type: object
                      properties:
                        transaction_type:
                          type: string
                          enum:
                            - payment
                            - refund
                        amount:
                          type: number
                        payment_method_id:
                          type: string
                  cancel_reason:
                    type:
                      - string
                      - 'null'
                  exchange_items:
                    type:
                      - array
                      - 'null'
                    items:
                      type: string
                  exchange_new_items:
                    type:
                      - array
                      - 'null'
                    items:
                      type: string
                  exchange_payment_method_id:
                    type:
                      - string
                      - 'null'
                  exchange_price_difference:
                    type:
                      - number
                      - 'null'
                  return_items:
                    type:
                      - array
                      - 'null'
                    items:
                      type: string
                  return_payment_method_id:
                    type:
                      - string
                      - 'null'
